name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the build+test job only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Non-blocking for now: report advisories without failing the build so a
      # newly disclosed CVE in a dependency doesn't block unrelated PRs. Tighten
      # (drop `continue-on-error`) once the audit output is consistently clean.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
