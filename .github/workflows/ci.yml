name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the build+test job only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Blocking: production dependencies (what ships in the image) must be free
      # of high/critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: full audit incl. dev tooling. Non-blocking so a CVE in a
      # dev-only dependency doesn't block unrelated PRs.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  integration-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: localboards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: localboards_test
        run: npm run test:integration

      - name: Run end-to-end tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: localboards_test
        run: npm run test:e2e

  browser-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: localboards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser (multiplayer) tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: localboards_test
        run: npm run test:browser

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate that the production image still builds (catches Dockerfile
      # regressions, e.g. the HEALTHCHECK). Build only — no push.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: localboards/localboards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
